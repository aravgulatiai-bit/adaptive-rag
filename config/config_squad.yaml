# SQuAD evaluation config — identical to config.yaml except the corpus source
# and a separate data directory, so the enterprise indexes in data/ are kept.

paths:
  data_dir: data_squad
  results_dir: results_squad
  corpus_file: corpus.jsonl
  questions_file: questions.jsonl
  embeddings_file: embeddings.npy
  bm25_file: bm25.pkl
  meta_file: index_meta.json

models:
  spacy_model: en_core_web_sm
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  llm_backend: flan-t5
  llm_model: google/flan-t5-base
  llm_max_new_tokens: 128
  llm_context_top_n: 3

dataset:
  source: squad
  docs_dir: sample_docs
  eval_questions_file: sample_docs_eval.jsonl
  chunk_max_chars: 700
  chunk_min_chars: 200
  name: squad
  split: validation
  num_passages: 300
  num_questions: 200
  questions_per_context: 1

features:
  query_length_cap: 30.0
  dependency_depth_cap: 10.0
  entity_density_cap: 0.5
  domain_density_cap: 0.20
  semantic_ambiguity_cap: 10.0
  intent_scale:
    definition: 0.10
    procedure: 0.40
    reasoning: 0.70
    comparison: 0.95
  intent_syntax_aware: true
  use_corpus_domain_vocab: true
  domain_vocab_file: domain_vocab.json
  domain_vocab_top_n: 80
  domain_keywords:
    - gdpr
    - ccpa
    - hipaa
    - regulation
    - compliance
    - data
    - privacy
    - biometric
    - retention
    - processing
    - controller
    - processor
    - consent
    - encryption
    - algorithm
    - protocol
    - neural
    - quantum
    - genome
    - enzyme
    - molecule
    - theorem
    - derivative
    - kinetics
    - obligation
    - liability
    - jurisdiction

policy:
  bands:
    - name: Simple
      lo: 0.00
      hi: 0.35
      top_k: 2
      use_bm25: false
      use_dense: true
      rerank: false
    - name: Medium
      lo: 0.35
      hi: 0.70
      top_k: 5
      use_bm25: true
      use_dense: true
      rerank: false
    - name: Complex
      lo: 0.70
      hi: 1.01
      top_k: 10
      use_bm25: true
      use_dense: true
      rerank: true

retrieval:
  rrf_k: 60
  candidate_pool: 50

evaluation:
  fixed_simple_top_k: 2
  fixed_complex_top_k: 10
